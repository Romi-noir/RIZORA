<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080611">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RIZORA">
<meta name="description" content="RIZORA - creator growth, missions, analytics, AI tools and community.">
<meta name="robots" content="index,follow">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/rizora-cover.png">
<title>RIZORA - Create. Grow. Earn.</title>

<style>
:root{
  --bg:#07060d;
  --panel:#0e0c18;
  --panel2:#141021;
  --panel3:#1a1529;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.05);
  --text:#f7f4ff;
  --muted:#aaa4ba;
  --purple:#9a6cff;
  --purple2:#6f42e8;
  --pink:#d86cff;
  --good:#52e0a8;
  --warn:#ffd166;
  --danger:#ff6f91;
  --shadow:0 25px 90px rgba(0,0,0,.45);
  --radius:22px;
  --radius2:15px;
  --max:1240px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,rgba(126,81,255,.15),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(215,89,255,.11),transparent 28%),
    linear-gradient(180deg,#080710 0%,#06050b 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:url("/rizora-space.png");
  background-size:cover;
  background-position:center;
  mix-blend-mode:screen;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%}

#app{
  position:relative;
  z-index:1;
  min-height:100vh;
}

.shell{
  width:min(var(--max),calc(100% - 32px));
  margin:auto;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(20px);
  background:rgba(7,6,13,.76);
  border-bottom:1px solid var(--line2);
}

.nav{
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:.08em;
}

.brand img{
  width:42px;
  height:42px;
  border-radius:13px;
  object-fit:cover;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 10px 35px rgba(130,80,255,.3);
}

.brand small{
  display:block;
  font-size:10px;
  color:var(--muted);
  letter-spacing:.17em;
  margin-top:2px;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:7px;
}

.navlinks button,
.mobile-menu button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 13px;
  border-radius:12px;
}

.navlinks button:hover,
.mobile-menu button:hover,
.navlinks button.active{
  color:var(--text);
  background:rgba(255,255,255,.055);
}

.navright{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;
  font-weight:900;
}

.menuBtn{
  display:none;
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
  color:#fff;
}

.mobile-menu{
  display:none;
  padding:0 0 16px;
  border-top:1px solid var(--line2);
}

.mobile-menu.open{
  display:grid;
  gap:3px;
}

.btn{
  border:1px solid var(--line);
  color:var(--text);
  background:rgba(255,255,255,.04);
  padding:12px 17px;
  border-radius:13px;
  font-weight:750;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.08);
}

.btn.primary{
  border-color:transparent;
  background:linear-gradient(135deg,var(--purple2),var(--pink));
  box-shadow:0 12px 35px rgba(126,78,230,.26);
}

.btn.ghost{
  background:rgba(255,255,255,.025);
}

.btn.danger{
  color:#ffd6df;
  border-color:rgba(255,111,145,.25);
}

.page{
  padding:36px 0 80px;
}

.hero{
  min-height:calc(100vh - 74px);
  display:grid;
  place-items:center;
  padding:50px 0 80px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:40px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  color:#dcd1ff;
  background:rgba(153,108,255,.09);
  border:1px solid rgba(153,108,255,.2);
  font-size:12px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.hero h1{
  margin:18px 0 15px;
  font-size:clamp(48px,7vw,90px);
  line-height:.92;
  letter-spacing:-.065em;
}

.hero h1 span{
  background:linear-gradient(135deg,#fff,#a77bff 55%,#e786ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  max-width:700px;
  color:var(--muted);
  font-size:18px;
  line-height:1.7;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}

.hero-card{
  padding:20px;
  border:1px solid var(--line);
  border-radius:28px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),
    rgba(9,8,15,.78);
  box-shadow:var(--shadow);
}

.hero-logo{
  padding:22px;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 30%,rgba(159,106,255,.23),transparent 45%),
    #0d0a17;
  border:1px solid var(--line);
}

.hero-logo img{
  width:100%;
  max-width:390px;
  aspect-ratio:1;
  display:block;
  margin:auto;
  object-fit:cover;
  border-radius:28px;
  filter:drop-shadow(0 35px 55px rgba(120,75,230,.28));
}

.stat-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}

.mini-stat{
  padding:14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.025);
}

.mini-stat strong{
  display:block;
  font-size:20px;
}

.mini-stat span{
  color:var(--muted);
  font-size:12px;
}

.section-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.section-title h2{
  margin:0;
  font-size:30px;
  letter-spacing:-.03em;
}

.section-title p{
  margin:6px 0 0;
  color:var(--muted);
}

.grid{
  display:grid;
  gap:16px;
}

.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{
  background:
    linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:0 18px 60px rgba(0,0,0,.18);
}

.card h3{
  margin:0 0 8px;
}

.card p{
  color:var(--muted);
  line-height:1.6;
  margin:0;
}

.kpi{
  font-size:34px;
  font-weight:900;
  letter-spacing:-.04em;
  margin-top:7px;
}

.kpi-label{
  color:var(--muted);
  font-size:13px;
}

.dashboard-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

.welcome{
  display:flex;
  gap:16px;
  align-items:center;
}

.welcome .avatar{
  width:52px;
  height:52px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.pill.good{
  color:#b9ffe4;
  border-color:rgba(82,224,168,.22);
  background:rgba(82,224,168,.07);
}

.progress{
  height:8px;
  border-radius:999px;
  background:#211d2c;
  overflow:hidden;
  margin-top:13px;
}

.progress span{
  display:block;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--purple),var(--pink));
}

.task{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:15px 0;
  border-bottom:1px solid var(--line2);
}

.task:last-child{border-bottom:0}
.task-main{min-width:0}
.task-title{
  font-weight:800;
  margin-bottom:4px;
}
.task-meta{
  color:var(--muted);
  font-size:12px;
}

.task-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.task-points{
  color:#d8c6ff;
  font-size:12px;
  font-weight:900;
}

.form{
  display:grid;
  gap:12px;
}

.input,
.textarea,
.select{
  width:100%;
  color:var(--text);
  background:#0b0912;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:rgba(154,108,255,.65);
  box-shadow:0 0 0 4px rgba(154,108,255,.08);
}

.textarea{
  min-height:130px;
  resize:vertical;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.label{
  display:block;
  margin-bottom:6px;
  color:#d6d0e1;
  font-size:12px;
  font-weight:700;
}

.result{
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:rgba(154,108,255,.06);
  border:1px solid rgba(154,108,255,.16);
  white-space:pre-wrap;
  line-height:1.6;
}

.chat{
  min-height:420px;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  display:grid;
  gap:10px;
  align-content:start;
  max-height:470px;
  overflow:auto;
  padding-right:3px;
}

.message{
  max-width:88%;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.55;
  white-space:pre-wrap;
}

.message.ai{
  background:#141021;
  border:1px solid var(--line);
}

.message.me{
  margin-left:auto;
  background:linear-gradient(135deg,rgba(110,65,232,.95),rgba(173,87,255,.88));
}

.chatbar{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.chatbar .input{
  flex:1;
}

.referral-box{
  display:flex;
  gap:8px;
}

.referral-box .input{
  flex:1;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:12px 8px;
  border-bottom:1px solid var(--line2);
  vertical-align:middle;
}

.table th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.table td{
  font-size:13px;
}

.muted{color:var(--muted)}
.right{text-align:right}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:17px;
}

.loading{
  min-height:180px;
  display:grid;
  place-items:center;
  color:var(--muted);
}

.spinner{
  width:32px;
  height:32px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--purple);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(30px);
  z-index:100;
  min-width:260px;
  max-width:min(520px,calc(100% - 30px));
  padding:13px 16px;
  background:#12101b;
  color:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.modal{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  place-items:center;
  padding:18px;
  background:rgba(0,0,0,.66);
  backdrop-filter:blur(14px);
}
.modal.show{display:grid}

.modal-card{
  width:min(470px,100%);
  background:#0d0b15;
  border:1px solid var(--line);
  border-radius:25px;
  box-shadow:var(--shadow);
  padding:24px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:18px;
}

.modal-close{
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:12px;
}

.auth-switch{
  margin-top:15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
.auth-switch button{
  border:0;
  background:none;
  color:#c9b4ff;
  font-weight:800;
}

.password-wrap{
  position:relative;
}
.password-wrap .input{
  padding-right:82px;
}
.password-toggle{
  position:absolute;
  top:7px;
  right:7px;
  border:0;
  background:rgba(255,255,255,.05);
  color:var(--muted);
  border-radius:9px;
  padding:7px 9px;
  font-size:11px;
}

.footer{
  border-top:1px solid var(--line2);
  margin-top:70px;
  padding:25px 0 35px;
  color:var(--muted);
  font-size:12px;
}

.hidden{display:none!important}

@media(max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .hero-card{max-width:620px;margin:auto}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:760px){
  .shell{width:min(var(--max),calc(100% - 22px))}
  .navlinks{display:none}
  .menuBtn{display:block}
  .hero{padding-top:30px}
  .hero h1{font-size:54px}
  .hero p{font-size:16px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .dashboard-head{align-items:flex-start;flex-direction:column}
  .task{align-items:flex-start;flex-direction:column}
  .task-actions{width:100%}
  .task-actions .btn{flex:1}
  .stat-strip{grid-template-columns:1fr}
  .table-wrap{overflow:auto}
  .table{min-width:650px}
}

@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>

<body>
<div id="app"></div>

<div id="authModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="eyebrow">RIZORA</div>
        <h2 id="authTitle" style="margin:12px 0 5px">Welcome back</h2>
        <p id="authSubtitle" class="muted">Enter your details to continue.</p>
      </div>
      <button class="modal-close" onclick="closeAuth()">x</button>
    </div>

    <form id="authForm" class="form" onsubmit="submitAuth(event)">
      <div id="displayNameField">
        <label class="label">Display name</label>
        <input class="input" id="authDisplayName" maxlength="80" placeholder="Your creator name">
      </div>

      <div>
        <label class="label">Username or email</label>
        <input class="input" id="authIdentifier" required autocomplete="username" placeholder="username">
      </div>

      <div id="emailField">
        <label class="label">Email</label>
        <input class="input" id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </div>

      <div>
        <label class="label">Password</label>
        <div class="password-wrap">
          <input class="input" id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="Your password">
          <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
        </div>
      </div>

      <div id="refField">
        <label class="label">Referral code <span class="muted">(optional)</span></label>
        <input class="input" id="authReferral" maxlength="60" placeholder="RIZORA-XXXX">
      </div>

      <button class="btn primary" id="authSubmit" type="submit">Log in</button>
    </form>

    <div id="authMessage" class="result hidden"></div>

    <div class="auth-switch">
      <span id="authSwitchText">New to RIZORA?</span>
      <button id="authSwitchButton" onclick="toggleAuthMode()">Create account</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const RIZORA_PRODUCTION_API = "https://rizora-guse.onrender.com";

window.RIZORA_API_BASE =
  /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)
    ? window.location.origin
    : RIZORA_PRODUCTION_API;

const state = {
  user: null,
  mode: "login",
  view: "home",
  tasks: [],
  profile: null,
  analytics: null,
  referrals: null,
  admin: null,
  support: [],
  messages: [
    {
      role: "ai",
      content: "Welcome to RIZORA AI. I can help you sharpen ideas, develop content, strengthen your brand, and plan your next move."
    }
  ]
};

function api(path, options = {}) {
  const base = String(window.RIZORA_API_BASE || "").replace(/\/+$/, "");
  const config = {
    credentials: "include",
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    },
    ...options
  };

  return fetch(base + path, config).then(async response => {
    const text = await response.text();
    let data = {};

    try {
      data = text ? JSON.parse(text) : {};
    } catch {
      data = { message: text || "Unexpected server response." };
    }

    if (!response.ok) {
      throw new Error(
        data.message ||
        data.error ||
        "Request failed."
      );
    }

    return data;
  });
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(window.__rzToast);
  window.__rzToast = setTimeout(() => {
    el.classList.remove("show");
  }, 2800);
}

function showLoading(text = "Loading RIZORA...") {
  document.getElementById("app").innerHTML = `
    <div class="page">
      <div class="shell">
        <div class="loading">
          <div style="text-align:center">
            <div class="spinner" style="margin:auto"></div>
            <div style="margin-top:12px">${escapeHtml(text)}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function initials(name) {
  const clean = String(name || "R").trim();
  return clean.slice(0,2).toUpperCase();
}

function isSuperAdmin() {
  return state.user &&
    state.user.role === "super_admin" &&
    ["romi","superadmin2"].includes(
      String(state.user.username || "").toLowerCase()
    );
}

function navButton(id, label) {
  return `
    <button class="${state.view === id ? "active" : ""}" onclick="navigate('${id}')">
      ${label}
    </button>
  `;
}

function shell(content) {
  const user = state.user;

  return `
    <div class="topbar">
      <div class="shell">
        <div class="nav">
          <button
            onclick="navigate('${user ? "home" : "landing"}')"
            style="border:0;background:none;color:#fff;padding:0"
            aria-label="RIZORA home"
          >
            <div class="brand">
              <img src="/rizora-cover.png" alt="RIZORA">
              <div>
                RIZORA
                <small>CREATE. GROW. EARN.</small>
              </div>
            </div>
          </button>

          ${
            user
            ? `
              <div class="navlinks">
                ${navButton("home","Home")}
                ${navButton("missions","Missions")}
                ${navButton("studio","Studio")}
                ${navButton("ai","AI")}
                ${navButton("referrals","Referrals")}
                ${navButton("support","Help")}
                ${isSuperAdmin() ? navButton("admin","Command Center") : ""}

async function completeTask(taskId) {
  try {
    const start = await api("/api/tasks/start", {
      method:"POST",
      body:JSON.stringify({ taskId })
    }).catch(() => null);

    if (start && start.success === false) {
      throw new Error(start.message || "Mission could not be started.");
    }

    const data = await api("/api/tasks/complete", {
      method:"POST",
      body:JSON.stringify({ taskId })
    });

    toast(
      data?.message ||
      (data?.reward
        ? `Mission completed. +${data.reward} pts`
        : "Mission completed.")
    );

    await refreshMe();

    state.tasks = [];
    navigate("missions");
  } catch (error) {
    toast(error.message);
  }
}

function renderMessage(message) {
  return `

    </div>
  `;
}

function scrollMessages() {
  const el = document.getElementById("messages");
  if (el) el.scrollTop = el.scrollHeight;
}

async function sendAI(event) {
  event.preventDefault();

  const input = document.getElementById("aiInput");
  const message = input.value.trim();

  if (!message) return;

  state.messages.push({
    role: "me",
    content: message
  });

  input.value = "";

  navigate("ai");

  try {
    const data = await api("/api/ai/chat", {
      method: "POST",
      body: JSON.stringify({
        message
      })
    });

    const reply =
      data?.reply ||
      data?.response ||
      data?.text ||
      data?.message ||
      data?.content;

    if (!reply || !String(reply).trim()) {
      throw new Error("The AI endpoint returned an empty response.");
    }

    state.messages.push({
      role: "ai",
      content: String(reply)
    });

    navigate("ai");
  } catch (error) {
    console.error("RIZORA AI request failed:", error);

    state.messages.push({
      role: "ai",
      content:
        "RIZORA AI could not complete that request.\n\n" +
        (error?.message || "The AI service is unavailable.")
    });

    navigate("ai");
    toast("RIZORA AI request failed.");
  }
}

                        <td>${Number(user.points || 0)}</td>
                        <td>
                          ${
                            user.status === "blocked"
                            ? `<button class="btn ghost" onclick="adminUserStatus('${escapeHtml(user.id)}','active')">Unblock</button>`
                            : `<button class="btn danger" onclick="adminUserStatus('${escapeHtml(user.id)}','blocked')">Block</button>`
                          }

            tasks.length
            ? tasks.slice(0,100).map(task => `

async function navigate(view) {
  state.view = view;
  window.scrollTo({top:0,behavior:"instant"});

  if (!state.user && view !== "landing") {
    openAuth("login");
    return;
  }

  if (view === "landing") {
    document.getElementById("app").innerHTML = landingView();
    return;
  }

  if (view === "home") {
    showLoading("Opening dashboard...");
    document.getElementById("app").innerHTML = await dashboardView();
    return;
  }

  if (view === "missions") {
    await missionsView();
    return;
  }

  if (view === "studio") {
    await studioView();
    return;
  }

  if (view === "ai") {
    await aiView();
    return;
  }

  if (view === "referrals") {
    await referralsView();
    return;
  }

  if (view === "support") {
    await supportView();
    return;
  }

  if (view === "admin") {
    if (!isSuperAdmin()) {
      toast("Command Center access denied.");
      navigate("home");
      return;
    }
    await adminView();
    return;
  }

  if (view === "profile") {
    document.getElementById("app").innerHTML = profileView();
    return;
  }

  navigate("home");
}

function toggleMenu() {
  const menu = document.getElementById("mobileMenu");
  if (menu) menu.classList.toggle("open");
}

function openAuth(mode = "login") {
  state.mode = mode;

  const modal = document.getElementById("authModal");
  const title = document.getElementById("authTitle");
  const subtitle = document.getElementById("authSubtitle");
  const submit = document.getElementById("authSubmit");
  const display = document.getElementById("displayNameField");
  const email = document.getElementById("emailField");
  const ref = document.getElementById("refField");
  const switchText = document.getElementById("authSwitchText");
  const switchButton = document.getElementById("authSwitchButton");
  const msg = document.getElementById("authMessage");

  if (mode === "signup") {
    title.textContent = "Create your account";
    subtitle.textContent = "Build your creator identity on RIZORA.";
    submit.textContent = "Create account";
    display.classList.remove("hidden");
    email.classList.remove("hidden");
    ref.classList.remove("hidden");
    switchText.textContent = "Already on RIZORA?";
    switchButton.textContent = "Log in";
  } else {
    title.textContent = "Welcome back";
    subtitle.textContent = "Enter your details to continue.";
    submit.textContent = "Log in";
    display.classList.add("hidden");
    email.classList.add("hidden");
    ref.classList.add("hidden");
    switchText.textContent = "New to RIZORA?";
    switchButton.textContent = "Create account";
  }

  msg.classList.add("hidden");
  document.getElementById("authForm").reset();
  document.getElementById("authPassword").type = "password";
  document.querySelector(".password-toggle").textContent = "Show";
  modal.classList.add("show");
}

function closeAuth() {
  document.getElementById("authModal").classList.remove("show");
}

function toggleAuthMode() {
  openAuth(state.mode === "login" ? "signup" : "login");
}

function togglePassword() {
  const input = document.getElementById("authPassword");
  const button = document.querySelector(".password-toggle");

  if (input.type === "password") {
    input.type = "text";
    button.textContent = "Hide";
  } else {
    input.type = "password";
    button.textContent = "Show";
  }
}

async function submitAuth(event) {
  event.preventDefault();

  const submit = document.getElementById("authSubmit");
  const msg = document.getElementById("authMessage");

  submit.disabled = true;
  submit.textContent = "Please wait...";

  const identifier =
    document.getElementById("authIdentifier").value.trim();

  const password =
    document.getElementById("authPassword").value;

  try {
    let data;

    if (state.mode === "signup") {
      data = await api("/api/auth/signup", {
        method:"POST",
        body:JSON.stringify({
          username:identifier,
          displayName:document.getElementById("authDisplayName").value.trim(),
          email:document.getElementById("authEmail").value.trim(),
          password,
          referralCode:document.getElementById("authReferral").value.trim()
        })
      });
    } else {
      data = await api("/api/auth/login", {
        method:"POST",
        body:JSON.stringify({
          identifier,
          username:identifier,
          email:identifier,
          password
        })
      });
    }

    if (!data || !data.user) {
      throw new Error(data?.message || "Authentication failed.");
    }

    state.user = data.user;

    closeAuth();

    await loadCreatorProfile();

    state.view = "home";
    await navigate("home");

    toast(
      state.mode === "signup"
        ? "Welcome to RIZORA."
        : "Welcome back."
    );
  } catch (error) {
    msg.textContent = error.message;
    msg.classList.remove("hidden");
  } finally {
    submit.disabled = false;
    submit.textContent =
      state.mode === "signup"
        ? "Create account"
        : "Log in";
  }
}

async function loadCreatorProfile() {
  try {
    const data = await api("/api/creator/profile");
    state.profile = data.profile || {};
  } catch {
    state.profile = {};
  }
}

async function refreshMe() {
  try {
    const data = await api("/api/auth/me");
    if (data?.user) {
      state.user = data.user;
      await loadCreatorProfile();
      return true;
    }
  } catch {}

  state.user = null;
  return false;
}

async function logout() {
  try {
    await api("/api/auth/logout", {
      method:"POST",
      body:"{}"
    });
  } catch {}

  state.user = null;
  state.profile = null;
  state.analytics = null;
  state.tasks = [];
  state.referrals = null;
  state.admin = null;
  state.view = "landing";

  navigate("landing");
  toast("Logged out.");
}

async function boot() {
  showLoading("Starting RIZORA...");

  const loggedIn = await refreshMe();

  if (loggedIn) {
    await navigate("home");
  } else {
    await navigate("landing");
  }
}

document.addEventListener("click", event => {
  const button = event.target.closest(".mobile-menu button");
  if (button) {
    const menu = document.getElementById("mobileMenu");
    if (menu) menu.classList.remove("open");
  }
});

window.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeAuth();
  }
});

boot();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>

    </button>

      <div class="rz-id-status">

      </div>

      <button class="rz-id-action" id="rzInstallButton" type="button">
        Install RIZORA
      </button>

<script>
(function(){
  "use strict";

  if (window.__RIZORA_VERIFICATION_LAYER_V2__) return;
  window.__RIZORA_VERIFICATION_LAYER_V2__ = true;

  var API =
    window.RIZORA_API_BASE ||
    (
      location.hostname === "localhost" ||
      location.hostname === "127.0.0.1"
        ? location.origin
        : "https://rizora-guse.onrender.com"
    );

  var modal = document.getElementById("rzVerificationModal");
  var launcher = document.getElementById("rzVerificationLauncher");
  var closeButton = document.getElementById("rzIdentityClose");
  var content = document.getElementById("rzIdentityContent");
  var installRow = document.getElementById("rzInstallRow");
  var installButton = document.getElementById("rzInstallButton");

  var deferredInstallPrompt = null;

  function esc(value){
    return String(value == null ? "" : value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function verifiedBadge(){
    return [
      '<span class="rz-verified-badge" title="Verified">',
      '<svg viewBox="0 0 24 24" aria-hidden="true">',
      '<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.7"></circle>',
      '<path d="M7.7 12.1 10.5 15l5.8-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>',
      '</svg>',
      '</span>'
    ].join("");
  }

  function avatarUrl(user){
    var value = user && user.avatarUrl ? String(user.avatarUrl).trim() : "";
    if (/^https?:\/\//i.test(value) || value.indexOf("/") === 0) {
      return value;
    }
    return "/rizora-cover.png";
  }

  function avatarMarkup(user){
    return '<img class="rz-id-avatar" src="' +
      esc(avatarUrl(user)) +
      '" alt="' +
      esc((user && (user.displayName || user.username)) || "RIZORA user") +
      '" onerror="this.onerror=null;this.src=\'/rizora-cover.png\';">';
  }

  async function api(path, options){
    var response = await fetch(API + path, Object.assign({
      credentials:"include",
      headers:{
        "Content-Type":"application/json"
      }
    }, options || {}));

    var text = await response.text();
    var data = {};

    try {
      data = text ? JSON.parse(text) : {};
    } catch(e){
      data = { raw:text };
    }

    if (!response.ok) {
      var message =
        data.message ||
        data.error ||
        data.raw ||
        ("Request failed (" + response.status + ")");
      throw new Error(message);
    }

    return data;
  }

  function openModal(){
    modal.classList.add("open");
    modal.setAttribute("aria-hidden","false");
    loadIdentity();
  }

  function closeModal(){
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
  }

  function showMessage(message, ok){
    var el = document.getElementById("rzIdentityMessage");
    if (!el) return;
    el.textContent = message || "";
    el.className = "rz-id-message " + (ok ? "ok" : "err");
  }

  async function loadIdentity(){
    content.innerHTML =
      '<div class="rz-id-status">' +
      '<div class="rz-id-status-title">RIZORA Identity</div>' +
      '<div class="rz-id-status-copy">Loading your identity...</div>' +
      '</div>';

    try {
      var me = await api("/api/auth/me");

      if (!me || !me.user) {
        content.innerHTML =
          '<div class="rz-id-status">' +
          '<div class="rz-id-status-title">Sign in required</div>' +
          '<div class="rz-id-status-copy">Sign in to manage your RIZORA identity and verification status.</div>' +
          '</div>';
        return;
      }

      var user = me.user;
      var verification = null;

      try {
        verification = await api("/api/verification/me");
      } catch(e){
        verification = {};
      }

      var verified =
        user.verified === true ||
        user.verificationStatus === "verified" ||
        verification.verified === true ||
        verification.status === "verified";

      var status =
        verification.status ||
        user.verificationStatus ||
        (verified ? "verified" : "unverified");

      var statusTitle = verified
        ? "Verified identity"
        : status === "pending"
          ? "Verification under review"
          : "Identity not verified";

      var statusCopy = verified
        ? "Your RIZORA account currently has verified identity status."
        : status === "pending"
          ? "Your verification request is currently being reviewed."
          : "You can submit a verification request from this panel.";

      content.innerHTML =
        '<div class="rz-id-head">' +
          avatarMarkup(user) +
          '<div>' +
            '<div class="rz-id-name">' +
              esc(user.displayName || user.username || "RIZORA user") +
              (verified ? verifiedBadge() : "") +
            '</div>' +
            '<div class="rz-id-handle">@' +
              esc(user.username || "") +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="rz-id-status">' +
          '<div class="rz-id-status-title">' +
            esc(statusTitle) +
          '</div>' +
          '<div class="rz-id-status-copy">' +
            esc(statusCopy) +
          '</div>' +
        '</div>' +

        (
          verified || status === "pending"
            ? ""
            :
              '<div class="rz-id-form">' +
                '<textarea id="rzVerificationReason" maxlength="1000" placeholder="Tell RIZORA why this account should be verified."></textarea>' +
                '<button class="rz-id-action" id="rzSubmitVerification" type="button">Request verification</button>' +
                '<div class="rz-id-muted">Verification requests do not guarantee approval.</div>' +
              '</div>'
        ) +

        '<div id="rzIdentityMessage"></div>';

      var submit = document.getElementById("rzSubmitVerification");

      if (submit) {
        submit.addEventListener("click", submitVerification);
      }

    } catch(error){
      content.innerHTML =
        '<div class="rz-id-status">' +
          '<div class="rz-id-status-title">Could not load identity</div>' +
          '<div class="rz-id-status-copy">' +
            esc(error.message || "Please try again.") +
          '</div>' +
        '</div>';
    }
  }

  async function submitVerification(){
    var button = document.getElementById("rzSubmitVerification");
    var reasonBox = document.getElementById("rzVerificationReason");

    if (!button || !reasonBox) return;

    button.disabled = true;
    button.textContent = "Submitting...";

    try {
      await api("/api/verification/request", {
        method:"POST",
        body:JSON.stringify({
          reason: reasonBox.value.trim()
        })
      });

      showMessage("Your verification request has been submitted.", true);
      await loadIdentity();
    } catch(error){
      showMessage(error.message || "Verification request failed.", false);
      button.disabled = false;
      button.textContent = "Request verification";
    }
  }

  window.addEventListener("beforeinstallprompt", function(event){
    event.preventDefault();
    deferredInstallPrompt = event;
    installRow.classList.add("show");
  });

  installButton.addEventListener("click", async function(){
    if (!deferredInstallPrompt) {
      showMessage("RIZORA is not currently offering an install prompt in this browser. You can use the browser menu to install the site as an app.", false);
      return;
    }

    deferredInstallPrompt.prompt();

    try {
      await deferredInstallPrompt.userChoice;
    } catch(e){}

    deferredInstallPrompt = null;
    installRow.classList.remove("show");
  });

  launcher.addEventListener("click", openModal);
  closeButton.addEventListener("click", closeModal);

  modal.addEventListener("click", function(event){
    if (event.target === modal) closeModal();
  });

  document.addEventListener("keydown", function(event){
    if (event.key === "Escape" && modal.classList.contains("open")) {
      closeModal();
    }
  });

})();

/* =========================================================
   RIZORA VERIFICATION — INDEPENDENT VIEW CONTROLLER
========================================================= */

function rizoraOpenVerification() {

  document
    .querySelectorAll(".view")
    .forEach(function(view) {
      view.classList.toggle(
        "active",
        view.id === "verification"
      );
    });

  document
    .querySelectorAll(
      '[data-view="verification"]'
    )
    .forEach(function(button) {
      button.classList.add("active");
    });

  document
    .querySelectorAll(
      ".nav button[data-view], .mobile-bottom button[data-view]"
    )
    .forEach(function(button) {

      if (
        button.dataset &&
        button.dataset.view === "verification"
      ) {
        button.classList.add("active");
      } else {
        button.classList.remove("active");
      }

    });

  const sidebar = document.getElementById("sidebar");

  if (sidebar) {
    sidebar.classList.remove("open");
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  loadVerification();

}

async function loadVerification() {

  const stateBox =
    document.getElementById("verificationState");

  const formCard =
    document.getElementById("verificationFormCard");

  const adminBox =
    document.getElementById("verificationAdmin");

  if (!stateBox) return;

  /*
   * Guest state:
   * Never show a fake loading state or an application form
   * when the visitor is not authenticated.
   */
  const loggedIn =
    Boolean(
      typeof state !== "undefined" &&
      state &&
      state.user
    );

  if (!loggedIn) {

    stateBox.innerHTML = `
      <div class="eyebrow">ACCOUNT REQUIRED</div>

      <h3>
        Sign in to access verification
      </h3>

      <p class="muted">
        Sign in to RIZORA to check your verification status
        or submit a verification request.
      </p>

      <button
        class="btn"
        type="button"
        onclick="showLogin()"
      >
        Log in
      </button>
    `;

    if (formCard) {
      formCard.classList.add("hidden");
    }

    if (adminBox) {
      adminBox.classList.add("hidden");
    }

    return;
  }

  if (formCard) {
    formCard.classList.remove("hidden");
  }

  stateBox.innerHTML = `
    <div class="eyebrow">CURRENT STATUS</div>
    <h3>Checking verification...</h3>
    <p class="muted">
      Loading your verification profile.
    </p>
  `;

  try {

    const result =
      await api(
        "/api/verification/me"
      );

    const request =
      result.request ||
      null;

    const status =
      String(
        result.status ||
        request?.status ||
        "not_submitted"
      ).toLowerCase();

    const labels = {
      not_submitted: "Not submitted",
      pending: "Under review",
      verified: "Verified",
      rejected: "Request rejected",
      revoked: "Verification revoked"
    };

    const descriptions = {
      not_submitted:
        "Your account has not submitted a verification request yet.",

      pending:
        "Your verification request is currently being reviewed.",

      verified:
        "Your account is verified on RIZORA.",

      rejected:
        "Your previous request was rejected. You may submit again when eligible.",

      revoked:
        "Your verification badge has been revoked."
    };

    const badge =
      status === "verified"
        ? '<span class="verify">✓ Verified</span>'
        : "";

    stateBox.innerHTML = `
      <div class="eyebrow">CURRENT STATUS</div>

      <h3>
        ${escapeHTML(
          labels[status] || status
        )}
        ${badge}
      </h3>

      <p class="muted">
        ${escapeHTML(
          descriptions[status] ||
          "Your verification status is available here."
        )}
      </p>
    `;

    if (formCard) {
      formCard.classList.toggle(
        "hidden",
        status === "pending" ||
        status === "verified"
      );
    }

    if (
      typeof isSuper === "function" &&
      isSuper() &&
      adminBox
    ) {
      adminBox.classList.remove("hidden");
      await loadVerificationAdmin();
    }

  } catch (error) {

    const message =
      String(
        error?.message || ""
      );

    if (
      /401|authentication|required|unauthorized/i.test(
        message
      )
    ) {

      stateBox.innerHTML = `
        <div class="eyebrow">ACCOUNT REQUIRED</div>

        <h3>
          Sign in to access verification
        </h3>

        <p class="muted">
          Your RIZORA session is not active.
        </p>

        <button
          class="btn"
          type="button"
          onclick="showLogin()"
        >
          Log in
        </button>
      `;

      if (formCard) {
        formCard.classList.add("hidden");
      }

      if (adminBox) {
        adminBox.classList.add("hidden");
      }

      return;
    }

    stateBox.innerHTML = `
      <div class="eyebrow">VERIFICATION</div>

      <h3>
        Verification could not be loaded
      </h3>

      <p class="muted">
        ${escapeHTML(message)}
      </p>

      <button
        class="btn small"
        type="button"
        onclick="loadVerification()"
      >
        Retry
      </button>
    `;

    if (formCard) {
      formCard.classList.add("hidden");
    }
  }
}
async function submitVerification(event) {

  event.preventDefault();

  const reasonEl =
    document.getElementById(
      "verificationReason"
    );

  const proofEl =
    document.getElementById(
      "verificationProof"
    );

  const reason =
    String(
      reasonEl?.value || ""
    ).trim();

  const proofUrl =
    String(
      proofEl?.value || ""
    ).trim();

  if (reason.length < 10) {

    toast(
      "Please give more detail about your creator identity.",
      "err"
    );

    return;
  }

  if (!proofUrl) {

    toast(
      "Add a public profile or proof URL.",
      "err"
    );

    return;
  }

  try {

    const result =
      await api(
        "/api/verification/apply",
        {
          method: "POST",

          body:
            JSON.stringify({
              reason,
              proofUrl
            })
        }
      );

    toast(
      result.message ||
      "Verification request submitted.",
      "ok"
    );

    if (reasonEl) {
      reasonEl.value = "";
    }

    if (proofEl) {
      proofEl.value = "";
    }

    await loadVerification();

  } catch (error) {

    toast(
      error.message,
      "err"
    );

  }

}

async function loadVerificationAdmin() {

  const box =
    document.getElementById(
      "verificationAdmin"
    );

  if (!box) return;

  try {

    const result =
      await api(
        "/api/superadmin/verification/requests"
      );

    const requests =
      Array.isArray(result.requests)
        ? result.requests
        : [];

    if (!requests.length) {

      box.innerHTML = `
        <div class="eyebrow">
          SUPER ADMIN
        </div>

        <h3>
          Verification review
        </h3>

        <p class="muted">
          No verification requests are waiting for review.
        </p>
      `;

      return;
    }

    box.innerHTML = `
      <div class="eyebrow">
        SUPER ADMIN
      </div>

      <h3>
        Verification review queue
      </h3>

      <div id="verificationReviewList"></div>
    `;

    const list =
      document.getElementById(
        "verificationReviewList"
      );

    requests.forEach(function(request) {

      const wrapper =
        document.createElement("div");

      wrapper.className = "card";

      wrapper.style.marginTop = "12px";

      const id =
        request.id ||
        request.requestId ||
        "";

      const username =
        request.username ||
        request.user?.username ||
        "unknown";

      const displayName =
        request.displayName ||
        request.user?.displayName ||
        username;

      const status =
        request.status ||
        "pending";

      const reason =
        request.reason ||
        "";

      const proofUrl =
        request.proofUrl ||
        request.proof ||
        "";

      wrapper.innerHTML = `
        <div
          style="
            display:flex;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
          "
        >

          <div>

            <strong>
              ${escapeHTML(displayName)}
            </strong>

            <div class="muted">
              @${escapeHTML(username)}
            </div>

          </div>

          <span class="pill">
            ${escapeHTML(status)}
          </span>

        </div>

        <p
          class="muted"
          style="margin-top:10px"
        >
          ${escapeHTML(reason)}
        </p>

        <div
          class="verification-proof"
          style="margin-top:10px"
        ></div>

        <div
          class="task-actions"
          style="margin-top:10px"
        ></div>
      `;

      const proofBox =
        wrapper.querySelector(
          ".verification-proof"
        );

      if (proofUrl) {

        const link =
          document.createElement("a");

        link.className =
          "btn secondary small";

        link.href =
          proofUrl;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          "View proof ↗";

        proofBox.appendChild(link);
      }

      const actions =
        wrapper.querySelector(
          ".task-actions"
        );

      const approve =
        document.createElement("button");

      approve.className =
        "btn small";

      approve.type =
        "button";

      approve.textContent =
        "Approve";

      approve.onclick =
        function() {
          actionVerification(
            id,
            "approve"
          );
        };

      actions.appendChild(
        approve
      );

      const reject =
        document.createElement("button");

      reject.className =
        "btn secondary small";

      reject.type =
        "button";

      reject.textContent =
        "Reject";

      reject.onclick =
        function() {
          actionVerification(
            id,
            "reject"
          );
        };

      actions.appendChild(
        reject
      );

      if (
        status === "verified"
      ) {

        const revoke =
          document.createElement(
            "button"
          );

        revoke.className =
          "btn secondary small";

        revoke.type =
          "button";

        revoke.textContent =
          "Revoke";

        revoke.onclick =
          function() {
            actionVerification(
              id,
              "revoke"
            );
          };

        actions.appendChild(
          revoke
        );
      }

      list.appendChild(
        wrapper
      );

    });

  } catch (error) {

    box.innerHTML = `
      <div class="eyebrow">
        SUPER ADMIN
      </div>

      <h3>
        Verification review unavailable
      </h3>

      <p class="muted">
        ${escapeHTML(error.message)}
      </p>
    `;

  }

}

async function actionVerification(
  requestId,
  action
) {

  if (!requestId) {

    toast(
      "Missing verification request ID.",
      "err"
    );

    return;
  }

  try {

    const result =
      await api(
        "/api/superadmin/verification/action",
        {
          method: "POST",

          body:
            JSON.stringify({
              requestId,
              action
            })
        }
      );

    toast(
      result.message ||
      "Verification updated.",
      "ok"
    );

    await loadVerificationAdmin();

  } catch (error) {

    toast(
      error.message,
      "err"
    );

  }

}

document.addEventListener(
  "submit",
  function(event) {

    if (
      event.target &&
      event.target.id ===
        "verificationApplicationForm"
    ) {

      submitVerification(
        event
      );

    }

  }
);

document.addEventListener(
  "click",
  function(event) {

    const button =
      event.target.closest(
        '[data-view="verification"]'
      );

    if (!button) return;

    event.preventDefault();

    rizoraOpenVerification();

  }
);

/* RIZORA_VERIFICATION_RUNTIME_HOOK */

(function(){

  function attachVerificationRuntime(){

    document
      .querySelectorAll(
        '[data-view="verification"]'
      )
      .forEach(function(button){

        if (
          button.dataset &&
          button.dataset.rizoraVerificationBound
        ) {
          return;
        }

        if (button.dataset) {
          button.dataset.rizoraVerificationBound = "1";
        }

        button.addEventListener(
          "click",
          function(event){

            event.preventDefault();

            if (
              typeof window.rizoraOpenVerification ===
              "function"
            ) {
              window.rizoraOpenVerification();
            }

          }
        );

      });

  }

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      attachVerificationRuntime
    );

  } else {

    attachVerificationRuntime();

  }

})();
</script>
