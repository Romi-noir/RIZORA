databases:
  - name: rizora-production-db
    plan: free

services:
  - type: web
    name: RIZORA
    runtime: node
    plan: free
    branch: main
    repo: https://github.com/Romi-noir/RIZORA
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: RIZORA_PUBLIC_URL
        value: https://rizora.com.ng
      # External PostgreSQL URL; set it in Render's Dashboard, never in source.
      - key: DATABASE_URL
        sync: false
      - key: RIZORA_MEDIA_ROOT
        value: /var/data/rizora
      - key: RIZORA_HF_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
