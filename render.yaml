databases:
  - name: rizora-production-db
    plan: basic-256mb

services:
  - type: web
    name: RIZORA
    runtime: node
    plan: starter
    branch: main
    repo: https://github.com/Romi-noir/RIZORA
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: rizora-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: RIZORA_PUBLIC_URL
        value: https://rizora.com.ng
      - key: DATABASE_URL
        fromDatabase:
          name: rizora-production-db
          property: connectionString
      - key: RIZORA_MEDIA_ROOT
        value: /var/data/rizora
