services:
  - type: web
    name: RIZORA
    runtime: node
    plan: free
    branch: main
    repo: https://github.com/Romi-noir/RIZORA
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: RIZORA_PUBLIC_URL
        value: https://rizora.com.ng
      # External Neon PostgreSQL URL; set it in Render's Dashboard, never in source.
      - key: DATABASE_URL
        sync: false
      # Supabase is used for Auth and private media only; Neon remains the app database.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PRIVATE_MEDIA_BUCKET
        value: rizora-private-media
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Cloudinary stores public creator media and generated audio.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Cloudflare Turnstile protects auth requests; never place its secret in Vercel.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Optional key for higher read-only Audius search limits.
      - key: AUDIUS_API_KEY
        sync: false
      # ElevenLabs powers voice, voice isolation, voiceover and music only.
      - key: ELEVENLABS_API_KEY
        sync: false
      # Pollinations generates NOIR and PLAY images; keep the secret key server-side.
      - key: POLLINATIONS_API_KEY
        sync: false
      # AIAPI-Pro / NovAI generates NOIR videos.
      - key: NOVAI_API_KEY
        sync: false
      - key: POLLINATIONS_IMAGE_MODEL
        value: black-forest-labs/flux.1-schnell
      - key: NOVAI_VIDEO_MODEL
        value: cogvideox-flash
