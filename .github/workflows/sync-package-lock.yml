name: Sync package lock

on:
  push:
    branches:
      - rizora-v2-rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, 'chore(ci): sync package lock')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rizora-v2-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync package-lock
        run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "RIZORA CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): sync package lock"
          git push origin HEAD:rizora-v2-rebuild
