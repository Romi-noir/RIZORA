name: RIZORA v2 validation

on:
  push:
    branches:
      - rizora-v2-rebuild
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 2 -type f -name '*.js' -not -path './node_modules/*' -not -path './database/*' -print0 |
            xargs -0 -n1 node --check
      - name: Smoke test
        run: node scripts/rizora-smoke.js
